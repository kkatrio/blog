<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>double pendulum</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: black;
                overflow: hidden;
            }
            #root {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100dvh;
            }
            canvas {
                max-width: 100vw;
                max-height: 100vh;
                width: auto;
                height: auto;
                object-fit: contain;
            }
            #widget {
                position: fixed;
                top: 16px;
                right: 16px;
                width: 160px;
                background: rgba(30, 30, 30, 0.75);
                backdrop-filter: blur(6px);
                border: 1px solid rgba(255,255,255,0.15);
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                z-index: 100;
                color: gray;
                font-family: sans-serif;
                font-size: 13px;
            }
            @media (max-width: 600px) {
                #widget {
                    top: auto;
                    bottom: 16px;
                    right: 50%;
                    transform: translateX(50%);
                    width: calc(100% - 48px);
                    max-width: 320px;
                }
                #root {
                    height: calc(100dvh - 120px);
                    align-items: flex-start;
                    padding-top: 6vh;
                }
            }
            #widget input {
                width: 100%;
                padding: 5px;
                border: 1px solid rgba(255,255,255,0.2);
                background: rgba(255,255,255,0.1);
                color: gray;
                box-sizing: border-box;
            }
            #widget button {
                padding: 6px;
                border: none;
                background: rgba(200, 160, 100, 0.7);
                color: black;
                cursor: pointer;
                font-size: 13px;
            }
            #widget button:hover {
                background: rgba(200, 160, 100, 0.8);
            }
            #widget-links {
                border-top: 1px solid rgba(255,255,255,0.15);
                padding-top: 4px;
                margin-top: 4px;
            }
            #widget-links a {
                color: rgba(180, 210, 255, 0.85);
                text-decoration: none;
                font-size: 12px;
            }
            #widget-links a:hover {
                color: rgba(180, 210, 255, 1);
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div id="widget">
            <div class="item">
                <label for="theta1">first angle in degrees</label>
                <input type="number" id="theta1" value="90" max="360"/>
            </div>
            <div class="item">
                <label for="theta2">second angle in degrees</label>
                <input type="number" id="theta2" value="90" max="360"/>
            </div>
            <button id="reload">reload</button>
            <div id="widget-links">
                <a id="link" style="float: right;" href="https://github.com/kkatrio/double-pendulum" target="_blank">info</a>
            </div>
        </div>
        <div id="root">
            <canvas id="canvas" height="1000" width="1000"></canvas>
        </div>
        <script type="module">
            import init from '/pkg/doublependulum.js';
            async function run() {
                await init();
            }
            run();
            const reloadBtn = document.getElementById('reload');
            reloadBtn.addEventListener('click', () => {
                location.reload();
            });
        </script>
    </body>
</html>
