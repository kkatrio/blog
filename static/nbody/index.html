<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>nbody</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                background: black;
            }
            #root {
                display: flex;
                /* anchor the canvas to the top */
                align-items: flex-start;
            }
            #widget {
                position: fixed;
                top: 16px;
                right: 16px;
                width: 160px;
                background: rgba(30, 30, 30, 0.75);
                backdrop-filter: blur(6px);
                border: 1px solid rgba(255,255,255,0.15);
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                z-index: 100;
                color: gray;
                font-family: sans-serif;
                font-size: 13px;
            }
            @media (max-width: 600px) {
                #widget {
                    top: auto;
                    bottom: 16px;
                    right: 50%;
                    transform: translateX(50%);
                    width: calc(100% - 48px);
                    max-width: 320px;
                }
            }
            #widget input {
                width: 100%;
                padding: 5px;
                border: 1px solid rgba(255,255,255,0.2);
                background: rgba(255,255,255,0.1);
                color: gray;
                box-sizing: border-box;
            }
            #widget button {
                padding: 6px;
                border: none;
                background: rgba(200, 160, 100, 0.7);
                color: black;
                cursor: pointer;
                font-size: 13px;
            }
            #widget button:hover {
                background: rgba(200, 160, 100, 0.8);
            }
            #widget-links {
                border-top: 1px solid rgba(255,255,255,0.15);
                padding-top: 4px;
                margin-top: 4px;
            }
            #widget-links a {
                color: rgba(180, 210, 255, 0.85);
                text-decoration: none;
                font-size: 12px;
            }
            #widget-links a:hover {
                color: rgba(180, 210, 255, 1);
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div id="widget">
            <div class="item">
                <label for="nbodies">number of bodies</label>
                <input type="number" id="nbodies" value="1400" />
            </div>
            <div class="item">
                <label for="nclusters">number of clusters</label>
                <input type="number" id="nclusters" value="3" />
            </div>
            <button id="reload">reload</button>
            <div id="widget-links">
                <a id="link" style="float: right;" href="https://github.com/kkatrio/nbody" target="_blank">info</a>
            </div>
        </div>

        <div id="root">
            <canvas id="canvas2"></canvas>
        </div>

        <script type="module">
            function resizeCanvas() {
                const canvas = document.getElementById("canvas2");
                const dpr = window.devicePixelRatio || 1;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const size = Math.max(vw, vh);
                canvas.style.width  = size + "px";
                canvas.style.height = size + "px";
                canvas.width  = Math.floor(size * dpr);
                canvas.height = Math.floor(size * dpr);
            }
            import init from '/pkg/nbody.js';
            async function run() {
                resizeCanvas();
                window.addEventListener("resize", resizeCanvas);
                await init();
            }
            run();
            const reloadBtn = document.getElementById('reload');
            reloadBtn.addEventListener('click', () => {
                location.reload();
            });
        </script>
        <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ddc816ac25a848368e9fbd41eb8b2823"}'></script>
    </body>
</html>
